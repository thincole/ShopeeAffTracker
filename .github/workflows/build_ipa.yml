name: Build Android APK & iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeCD01.02-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build Native iOS App & IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build iOS App with Xcode
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -sdk iphoneos -configuration Release -derivedDataPath build_derived CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p build_ipa/Payload
          cp -r build_derived/Build/Products/Release-iphoneos/ShopeeCD.app build_ipa/Payload/
          cd build_ipa
          zip -r ../ShopeeCD01.02.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeCD01.02-IPA
          path: ShopeeCD01.02.ipa
