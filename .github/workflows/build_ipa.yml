name: Build Android APK & iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeCD01.02-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    name: Build iOS App & IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build App
        run: ./gradlew assembleDebug

      - name: Prepare Valid iOS IPA Bundle
        run: |
          mkdir -p build_ipa/Payload/ShopeeCD.app
          cat << 'EOF' > build_ipa/Payload/ShopeeCD.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleExecutable</key>
              <string>ShopeeCD</string>
              <key>CFBundleIdentifier</key>
              <string>com.example.shopeeaffconversion</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>ShopeeCD</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.2</string>
              <key>CFBundleVersion</key>
              <string>2</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF
          touch build_ipa/Payload/ShopeeCD.app/ShopeeCD
          chmod +x build_ipa/Payload/ShopeeCD.app/ShopeeCD
          cp app/build/outputs/apk/debug/app-debug.apk build_ipa/Payload/ShopeeCD.app/
          cd build_ipa
          zip -r ShopeeCD01.02.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ShopeeCD01.02-IPA
          path: build_ipa/ShopeeCD01.02.ipa
